batch_size: 64
learning_rate: 0.00003   # 3e-5 (crucial for pretrained BERT/DistilBERT)
epochs: 5
max_seq_length: 256
top_k: 10

model:
  pretrained_model_name: distilbert-base-uncased
  pooling_type: mean
  emb_dim: 768           # Use native 768 (no random projection head to learn from scratch)
  query_encoder_weights_path: retrieval_data/pretrained_query_encoder_weights.pt
  document_encoder_weights_path: retrieval_data/pretrained_document_encoder_weights.pt
